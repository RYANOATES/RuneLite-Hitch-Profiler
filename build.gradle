plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven { url = 'https://repo.runelite.net'; content { includeGroupByRegex("net\\.runelite.*") } }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'runelitehitchprofiler.RuneLiteHitchProfilerLauncher'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation 'junit:junit:4.12'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = pluginMainClass
    jvmArgs '-ea'
    args '--developer-mode', '--debug'
}

group = 'com.runelitehitchprofiler'
version = '2.0.0'

// OneDrive/workspace ACLs can prevent Gradle deleting generated directories.
// Keep disposable outputs in the OS temporary directory, away from user data.
layout.buildDirectory = file("${System.getProperty('java.io.tmpdir')}/runelite-hitch-profiler-build")

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

tasks.register('shadowJar', Jar) {
    dependsOn configurations.testRuntimeClasspath
    manifest { attributes('Main-Class': pluginMainClass, 'Multi-Release': true) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from sourceSets.test.output
    from { configurations.testRuntimeClasspath.collect { file -> file.isDirectory() ? file : zipTree(file) } }
    exclude 'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', '**/module-info.class'
    archiveClassifier.set('shadow')
    archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
