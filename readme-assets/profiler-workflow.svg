<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">How RuneLite Hitch Profiler works</title><desc id="desc">Three stages: measure a frame gap, collect bounded context clues for severe hitches, and review local session history.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#2a2b24"/><stop offset="1" stop-color="#1c201d"/></linearGradient><linearGradient id="card" x2="0" y2="1"><stop stop-color="#343126"/><stop offset="1" stop-color="#242720"/></linearGradient></defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/><rect x="10" y="10" width="1180" height="280" rx="12" fill="none" stroke="#645438"/>
  <g font-family="system-ui,sans-serif">
    <g transform="translate(36 36)"><rect width="340" height="228" rx="8" fill="url(#card)" stroke="#796744"/><circle cx="40" cy="40" r="22" fill="#282b24" stroke="#dbb56c"/><text x="40" y="47" fill="#f0d28f" font-size="20" text-anchor="middle">01</text><text x="76" y="46" fill="#f0dfb7" font-size="21" font-family="Georgia,serif">Measure the gap</text><path d="M28 116h55l18-26 21 55 26-38 20 18h45" fill="none" stroke="#8bbdb4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M181 86v72" stroke="#c62828" stroke-width="5"/><text x="28" y="194" fill="#bdb39d" font-size="14">Frame-callback timing shows when a pause</text><text x="28" y="215" fill="#bdb39d" font-size="14">was observed, not the GPU's exact work.</text></g>
    <path d="M392 150h34m-10-10 10 10-10 10" fill="none" stroke="#dbb56c" stroke-width="3"/>
    <g transform="translate(430 36)"><rect width="340" height="228" rx="8" fill="url(#card)" stroke="#796744"/><circle cx="40" cy="40" r="22" fill="#282b24" stroke="#dbb56c"/><text x="40" y="47" fill="#f0d28f" font-size="20" text-anchor="middle">02</text><text x="76" y="46" fill="#f0dfb7" font-size="21" font-family="Georgia,serif">Inspect clues</text><g fill="#dfc997"><rect x="37" y="101" width="20" height="48" rx="2"/><rect x="67" y="83" width="20" height="66" rx="2"/><rect x="97" y="95" width="20" height="54" rx="2"/><rect x="127" y="68" width="20" height="81" rx="2" fill="#c86f5b"/></g><path d="M30 160h130" stroke="#8bbdb4" stroke-width="3"/><text x="28" y="194" fill="#bdb39d" font-size="14">Severe hitches add bounded stack samples,</text><text x="28" y="215" fill="#bdb39d" font-size="14">nearby events and a location when available.</text></g>
    <path d="M786 150h34m-10-10 10 10-10 10" fill="none" stroke="#dbb56c" stroke-width="3"/>
    <g transform="translate(824 36)"><rect width="340" height="228" rx="8" fill="url(#card)" stroke="#796744"/><circle cx="40" cy="40" r="22" fill="#282b24" stroke="#dbb56c"/><text x="40" y="47" fill="#f0d28f" font-size="20" text-anchor="middle">03</text><text x="76" y="46" fill="#f0dfb7" font-size="21" font-family="Georgia,serif">Review locally</text><path d="M47 84h91l22 22v55H47Z" fill="#222720" stroke="#dbb56c" stroke-width="2"/><path d="M138 84v24h22" fill="none" stroke="#dbb56c" stroke-width="2"/><path d="M61 127h89M61 140h74" stroke="#8c754a" stroke-width="3"/><path d="M61 115h55" stroke="#8bbdb4" stroke-width="4"/><text x="28" y="194" fill="#bdb39d" font-size="14">JSONL keeps the record; a themed HTML</text><text x="28" y="215" fill="#bdb39d" font-size="14">report makes sessions easy to browse.</text></g>
  </g>
</svg>